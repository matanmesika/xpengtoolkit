name: XPENG startup I/O regression

on:
  push:
    branches:
      - fix/async-tenant-cache-and-tracker-import
  pull_request:
    paths:
      - custom_components/xpeng/__init__.py
      - custom_components/xpeng/device_tracker.py
      - tests/test_startup_io_regression.py
      - .github/workflows/xpeng-startup-io-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-io-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependencies
        run: python -m pip install pytest
      - name: Compile integration source and tests
        run: python -m compileall -q custom_components/xpeng tests/test_startup_io_regression.py
      - name: Run targeted tests against production helpers
        run: python -m pytest -q tests/test_startup_io_regression.py
