name: XPENG renewal MQTT handoff

on:
  push:
    branches:
      - fix/renewal-mqtt-reconnect-handoff
  pull_request:
    paths:
      - custom_components/xpeng/credential_import.py
      - tests/test_credential_import_reconnect.py
      - tests/test_renew_failed_delivery.py
      - .github/workflows/xpeng-renewal-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renewal-handoff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile changed source and test modules
        run: |
          python -m py_compile custom_components/xpeng/credential_import.py
          python -m py_compile tests/test_credential_import_reconnect.py
      - name: Test busy reconnect and import recovery
        run: python -m unittest discover -s tests -p test_credential_import_reconnect.py -v
      - name: Test renewal worker delivery retry behavior
        run: python -m unittest discover -s tests -p test_renew_failed_delivery.py -v
